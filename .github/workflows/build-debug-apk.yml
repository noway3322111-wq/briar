name: Build debug APK

# Builds an installable test version of the app.
# Run it from the "Actions" tab: Build debug APK -> Run workflow.
# When it finishes, download "briar-debug-apk" from the bottom of the run page.
on:
  workflow_dispatch:
  push:
    branches: [lg-messages-style]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The briar-mailbox submodule is only needed for integration tests,
      # not for assembleOfficialDebug, so it is not checked out.
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu machines already include the Android SDK.
      # Gradle only needs the licenses accepted so it can download what is missing.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew -Djava.security.egd=file:/dev/urandom assembleOfficialDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: briar-debug-apk
          path: briar-android/build/outputs/apk/official/debug/*.apk
          if-no-files-found: error
