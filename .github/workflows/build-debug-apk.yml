name: Build debug APK

# Builds an installable test version of the app.
# Run it from the "Actions" tab: Build debug APK -> Run workflow.
# When it finishes, download "briar-debug-apk" from the bottom of the run page.
on:
  workflow_dispatch:
  push:
    branches: [lg-messages-style]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew -Djava.security.egd=file:/dev/urandom assembleOfficialDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: briar-debug-apk
          path: briar-android/build/outputs/apk/official/debug/*.apk
          if-no-files-found: error
